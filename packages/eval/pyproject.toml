[project]
name = "eval"
version = "0.1.0"
description = "주택임대차 보증금 반환 챗봇 — 평가 하니스"
requires-python = ">=3.11"
dependencies = [
    "rag",
    "api",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rag = { workspace = true }
api = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: 실제 모델/인덱스를 쓰는 느린 테스트"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval"]
