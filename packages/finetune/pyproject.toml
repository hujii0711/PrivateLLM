[project]
name = "finetune"
version = "0.1.0"
description = "주택임대차 보증금 반환 챗봇 — QLoRA 학습 + A/B"
requires-python = ">=3.11"
dependencies = [
    "api",
    "eval",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
api = { workspace = true }
eval = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: 실제 모델/학습을 쓰는 느린 테스트"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finetune"]
