# 이 프로젝트 전체의 Python 개발 규칙을 정하는 파일입니다.
# 쉽게 말하면 “이 저장소는 어떤 하위 프로젝트들을 묶어서 관리하고, 코드는 어떤 스타일로 검사할지”를 적어둔 설정 파일이에요.
# uv라는 Python 패키지/가상환경 관리 도구 설정입니다.
# 현재 프로젝트는 하나의 Python 프로젝트가 아니라 여러 개의 작은 프로젝트를 묶은 구조입니다.
# 예를 들면:
# pipelines
# packages/rag
# packages/eval
# packages/ftdata
# packages/finetune
# apps/api
# 이런 것들이 같은 워크스페이스 안에서 같이 관리됩니다.
# 단, apps/web은 제외되어 있습니다.

[tool.uv.workspace]
members = ["pipelines", "packages/*", "apps/*"]
exclude = ["apps/web"]

# ruff는 Python 코드 검사 도구입니다.
# 코드에서 문법 실수, 안 쓰는 import, 정렬 문제, 오래된 문법 등을 빠르게 잡아줍니다.

[tool.ruff]
target-version = "py311" # 이 프로젝트는 Python 3.11 기준으로 검사합니다.
line-length = 200 # 한 줄 길이는 최대 100자 정도를 기준으로 봅니다. 너무 긴 줄은 읽기 어려우니 적당히 줄바꿈하자는 규칙입니다.
extend-exclude = [".venv", "data", "models", "apps/web", "**/__pycache__"] # 검사하지 않을 폴더들입니다.

# 여기는 Ruff가 어떤 종류의 문제를 잡을지 정합니다.
# E: Python 스타일 오류
# W: 경고성 스타일 문제
# F: 실제 버그 가능성이 있는 문제, 예: 안 쓰는 변수/import
# I: import 정렬 문제
# UP: 더 최신 Python 문법으로 바꿀 수 있는 부분
# B: 버그를 만들기 쉬운 코드 패턴
[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: flake8-bugbear
select = ["E", "W", "F", "I", "UP", "B"]

# 내 프로젝트 패키지 이름 설정
# import requests
# from rag.retriever import Retriever
# from api.schemas import ChatRequest
# 여기서 requests는 외부 라이브러리이고, rag, api는 이 프로젝트 내부 코드입니다.
# Ruff에게:
# rag, api, pipelines, eval, ftdata, finetune은 우리 프로젝트 코드야. 라고 알려주는 설정입니다.
# 그래야 import를 정렬할 때 외부 라이브러리와 내부 모듈을 올바르게 구분합니다.
# known-first-party: 이 목록에 있는 모듈들을 "우리 프로젝트 내부 모듈(1st-party)"로 인식시켜, import 정렬 시 표준 라이브러리 → 서드파티 라이브러리 → 자체 모듈 순서로 그룹핑되게 합니다.
# 즉 rag, api, pipelines, eval, ftdata, finetune이라는 이름의 모듈을 import할 때, ruff가 이를 외부 패키지(예: numpy, requests)와 구분해서 마지막 그룹에 배치합니다.
[tool.ruff.lint.isort]
known-first-party = ["rag", "api", "pipelines", "eval", "ftdata", "finetune"]

