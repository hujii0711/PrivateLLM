# API 서버 프로젝트 하나에 대한 설정 파일입니다.
# 이전에 봤던 루트 pyproject.toml이 “전체 저장소 공통 설정”이라면,
# 이 파일은 “apps/api 백엔드 서버만의 설정”이라고 보면 됩니다.

# 프로젝트 기본 정보
# 이 API 패키지의 이름은 api입니다.
# Python은 최소 3.11 이상이 필요합니다.
# 설명에 적힌 것처럼 이 패키지는 주택임대차 보증금 반환 챗봇의 백엔드 API 서버입니다. 
# 실제 서버 진입점은 [main.py (line 1)](/Users/fujii0711/Claude/PrivateLLM/apps/api/src/api/main.py:1)
# 에 있고, FastAPI 앱을 만듭니다.
[project]
name = "api"
version = "0.1.0"
description = "주택임대차 보증금 반환 챗봇 — FastAPI RAG 백엔드"
requires-python = ">=3.11"

# 각각 쉽게 말하면:
# fastapi: API 서버를 만드는 웹 프레임워크
# uvicorn: FastAPI 서버를 실제로 실행해주는 서버 프로그램
# sse-starlette: 답변을 한 번에 보내지 않고, 토큰처럼 조금씩 스트리밍하기 위한 도구
# pydantic: 요청/응답 데이터가 올바른지 검사하는 도구
# rag: 이 저장소 안에 있는 내부 RAG 패키지
# mlx-lm: Apple Silicon Mac에서 로컬 LLM을 실행하기 위한 라이브러리
# 즉, 이 API 서버는 사용자의 질문을 받고, 내부 rag 패키지로 관련 법령/판례를 검색한 뒤, mlx-lm 모델로 답변을 생성하는 구조입니다.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "rag",
    "mlx-lm>=0.18",
]

# 개발용 의존성
# 이건 실제 서비스 실행용이 아니라 개발/테스트용입니다.
# pytest: 테스트 실행 도구
# httpx: API 요청을 테스트할 때 쓰는 HTTP 클라이언트
[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

# 내부 rag 패키지 연결
# 이 설정이 중요합니다.
# dependencies에 "rag"가 있었는데, 이 rag는 외부에서 다운로드하는 패키지가 아니라 현재 저장소 안의
# [packages/rag (line 1)](/Users/fujii0711/Claude/PrivateLLM/packages/rag/pyproject.toml:1)를
# 사용하라는 뜻입니다. 쉽게 말하면: api 서버는 같은 저장소 안에 있는 rag 코드를 가져다 쓴다.
[tool.uv.sources]
rag = { workspace = true }

# 테스트 실행 규칙입니다.
[tool.pytest.ini_options]
pythonpath = ["src"] # 테스트할 때 src 폴더를 Python import 경로에 넣습니다. 그래서 api.main, api.settings 같은 import가 가능해집니다
testpaths = ["tests"] # 테스트 파일은 apps/api/tests 안에서 찾습니다.
markers = ["slow: 실제 MLX 모델을 쓰는 느린 테스트"] # slow라는 표시를 테스트에 붙일 수 있습니다. 실제 LLM 모델을 로딩하는 테스트는 느리니까, 일반 테스트와 구분하려는 목적입니다.

# 빌드 설정: 이건 이 API 코드를 Python 패키지로 빌드할 때 쓰는 설정입니다.
[build-system]
requires = ["hatchling"] # hatchling: Python 패키지를 빌드하는 도구
build-backend = "hatchling.build" 

[tool.hatch.build.targets.wheel]
packages = ["src/api"] # packages = ["src/api"]: 실제 패키지 코드는 src/api 폴더에 있다는 뜻

# 전체 흐름을 한 줄로 정리하면:
# apps/api는 FastAPI로 만든 백엔드 서버이고, 내부 rag 패키지로 근거 문서를 검색한 뒤, mlx-lm 로컬 모델로 답변을 스트리밍해주는 역할을 합니다.

# 실제 동작 흐름은 대략 이렇게 이어집니다.
# 사용자 질문
# → FastAPI /chat
# → rag Retriever로 관련 문서 검색
# → LLM에게 프롬프트 전달
# → SSE로 답변을 조금씩 전송
# → 마지막에 전체 답변과 출처 반환
 